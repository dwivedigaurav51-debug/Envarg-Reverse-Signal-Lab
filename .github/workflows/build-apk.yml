name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [olympia-trade-signal]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Olympia JavaScript and risk gate regression tests
        run: |
          node -e "const fs=require('fs'),vm=require('vm');const h=fs.readFileSync('app/src/main/assets/index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('Missing inline script');new vm.Script(m[1]);if(h.indexOf('</html>')!==h.lastIndexOf('</html>'))throw Error('Duplicate document tail');console.log('Inline JS and HTML structure PASS')"
          node --check app/src/main/assets/olympia2050.js
          node --check tests/olympia-risk.test.cjs
          node tests/olympia-risk.test.cjs
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Olympia-Trade-Signal-debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish directly downloadable APK release
        if: github.ref == 'refs/heads/olympia-trade-signal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK" && test -s "$APK"
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | head -n 1 | cut -d"'" -f2)
          TAG="olympia-v${VERSION}-run${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK#Olympia-Trade-Signal-v${VERSION}.apk" --title "Olympia Trade Signal v${VERSION} APK" --notes "Android debug APK for virtual research only. Download the .apk asset directly. Not a verified trading signal." 
